spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: url-shortener

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: url-shortener-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1200000}

  jpa:
    open-in-view: false
    hibernate:
      # Development only: entities own the schema so it can be iterated on
      # without migrations. Production must override with `validate`.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

url-shortener:
  cache:
    ttl: ${REDIS_CACHE_TTL:PT1H}
  jobs:
    click-persistence-delay: ${CLICK_PERSISTENCE_DELAY_MS:10000}
    click-persistence-initial-delay: ${CLICK_PERSISTENCE_INITIAL_DELAY_MS:10000}
    expiry-cleanup-delay: ${EXPIRY_CLEANUP_DELAY_MS:60000}
    expiry-cleanup-initial-delay: ${EXPIRY_CLEANUP_INITIAL_DELAY_MS:60000}

server:
  port: ${SERVER_PORT:8080}
