<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration - URL Shortener</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Registration</h1>

    <main class="auth-container">

        <div class="auth-box">

            <form id="registerForm">

                <!-- Name -->
                <div class="form-group">

                    <label for="name">
                        Name:
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password:
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Register button -->
                <button
                    type="submit"
                    class="primary-button"
                >
                    Register
                </button>

            </form>


            <p class="auth-link">
                Already have an account?

                <a href="login.html">
                    Login
                </a>
            </p>

        </div>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
