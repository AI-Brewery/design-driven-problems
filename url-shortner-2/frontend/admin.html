<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - URL Shortener</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>
    <div id="navbar"></div>
    <h1>Admin Dashboard</h1>


    <main class="container">

        <section class="urls-box">

            <table>

                <thead>

                    <tr>

                        <th class="checkbox-column">

                            <input
                                type="checkbox"
                                id="selectAll"
                            >

                        </th>

                        <th>
                            Short URL
                        </th>

                        <th>
                            Original URL
                        </th>

                        <th>
                            User
                        </th>

                        <th>
                            Type
                        </th>

                        <th>
                            Create Date
                        </th>

                        <th>
                            Expiry Date
                        </th>

                    </tr>

                </thead>


                <tbody id="adminUrlsTableBody">

                    <!-- Admin URLs will appear here -->

                </tbody>

            </table>

        </section>


        <div class="delete-container">

            <button
                id="deleteBtn"
                class="delete-button"
            >
                Delete Selected
            </button>

        </div>

    </main>

    <script src="js/nav.js"></script>
    <script src="js/admin.js"></script>

</body>

</html>
